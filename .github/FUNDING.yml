<style>
/* Pastikan elemen yang ingin Anda ubah posisinya memiliki z-index yang lebih tinggi */
/* dari elemen lain jika perlu, misalnya z-index: 1000; */
.overlay-text {
  /* Mengubah posisi agar FIXED, sehingga tidak bergerak saat di-scroll */
  position: fixed; 
  /* Mengatur agar muncul di POJOK KIRI ATAS */
  top: 10px; /* Jarak dari atas */
  left: 10px; /* Jarak dari kiri */
  
  /* Reset properti yang tidak diperlukan lagi untuk posisi kiri atas */
  bottom: auto; 
  width: auto; /* Teks akan mengambil lebar sesuai isinya */
  text-align: left; /* Teks rata kiri */
  
  /* CSS lain untuk tampilan teks tetap dipertahankan */
  color: white;
  font-size: 20px; /* Ukuran teks sedikit diperkecil agar lebih ringkas di pojok atas */
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  text-shadow: 0 0 12px #ff4500, 0 0 22px #ff8c00;
  animation: glow 1.5s infinite alternate, rainbow 2.2s infinite linear;
  padding: 5px 10px; /* Tambahkan sedikit padding */
  background: rgba(0, 0, 0, 0.4); /* Background semi-transparan agar teks lebih menonjol */
  border-radius: 5px;
  z-index: 9999; /* Pastikan ia berada di atas elemen lain */
}

/* Animasi dan efek hover/active tetap sama */
@keyframes glow {
  0% { text-shadow:0 0 8px #ff4500, 0 0 14px #ff8c00; }
  100% { text-shadow:0 0 18px #ffae00, 0 0 28px #ff4500; }
}
@keyframes rainbow {
  0% { color:#ff0000; }
  20% { color:#ff7300; }
  40% { color:#ffee00; }
  60% { color:#00ff85; }
  80% { color:#0099ff; }
  100% { color:#ff00dd; }
}
.overlay-text:active {
  transform: scale(0.94);
  text-shadow:0 0 18px #ffffff, 0 0 28px #ff8800;
}
/* Pastikan body dan flame tidak mengganggu tata letak utama blog */
/* body { margin:0; background:#000; overflow:hidden; font-family: system-ui; } (Hapus ini jika kode ini diletakkan di footer) */

#flame {
  /* Biarkan tetap fixed dan menutupi seluruh layar */
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: -1; /* Pindahkan ke belakang elemen lain */
}
</style>

<div class="overlay-text" onclick="gotoStory()">
  🌶️ YANG SUKA CERITA CROT 'BINOR' DISINI! 💋
</div>

<canvas id="flame"></canvas>

<script>
function gotoStory() {
  window.location.href =
    "https://aleos-tube-daily-vlog-anak-rantau.blogspot.com/2025/11/cerita-yuli-ketangguhan-di-balik-senyum.html";
}

// Skrip Efek Api (Tidak ada perubahan signifikan, hanya memastikan variabel global tidak bertabrakan)
(() => {
  const canvas = document.getElementById("flame");
  if (!canvas) return; // Penting: pastikan elemen ada
  const ctx = canvas.getContext("2d");

  let W, H, DPR;
  function resize() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.scale(DPR, DPR);
  }
  resize();
  window.addEventListener("resize", resize);

  const particles = [];

  class FlameParticle {
    constructor() { this.reset(); }
    reset() {
      this.x = W/2 + (Math.random() - 0.5) * (W * 0.15);
      this.y = H - 20;
      this.vx = (Math.random()-0.5)*0.3;
      this.vy = -(Math.random()*1.3 + 0.8);
      this.life = 0;
      this.ttl = 0.6 + Math.random()*0.8;
      this.size = 25 + Math.random()*40;
      this.hue = 20 + Math.random()*10;
    }
    update(dt) {
      this.life += dt;
      const p = this.life / this.ttl;
      this.x += this.vx * dt * 60;
      this.y += this.vy * dt * 60;
      this.alpha = 1 - p;
      this.size *= 0.985;
      if (p >= 1) this.reset();
    }
    draw() {
      const g = ctx.createRadialGradient(this.x, this.y, 2, this.x, this.y, this.size);
      g.addColorStop(0, `hsla(${this.hue},100%,70%,${this.alpha})`);
      g.addColorStop(0.4, `hsla(${this.hue-10},90%,45%,${this.alpha})`);
      g.addColorStop(1, `hsla(${this.hue-25},80%,20%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
      ctx.fill();
    }
  }

  for(let i=0; i<240; i++) particles.push(new FlameParticle());

  let last = performance.now()/1000;
  function loop(nowms) {
    const now = nowms/1000;
    const dt = now - last;
    last = now;

    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = "lighter";
    particles.forEach(p => { p.update(dt); p.draw(); });

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
